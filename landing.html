<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendMate | Student Expense Tracker</title>
    <meta name="description" content="SpendMate helps students track expenses, plan budgets, and save smarter." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #f6f9ff 0%, #eef7ff 28%, #f7f3ff 100%);
            color: #1c2438;
        }

        .landing-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .landing-wrap {
            width: min(1200px, 100%);
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(122, 148, 214, 0.18);
            box-shadow: 0 30px 70px rgba(31, 64, 138, 0.14);
            border-radius: 32px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .landing-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 30px;
            border-bottom: 1px solid rgba(120, 130, 175, 0.12);
            background: rgba(255, 255, 255, 0.3);
        }

        .landing-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            color: #192646;
            letter-spacing: -0.04em;
            font-size: 1.2rem;
        }

        .landing-brand-badge {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, #4f7cff, #7a68f4);
            box-shadow: 0 12px 25px rgba(79, 124, 255, 0.25);
        }

        .landing-main {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            min-height: 660px;
        }

        .landing-copy {
            padding: 54px 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(86, 122, 255, 0.09);
            color: #355ad7;
            font-weight: 700;
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 22px 0 12px;
            font-size: clamp(2.8rem, 3.4vw, 5rem);
            line-height: 0.96;
            letter-spacing: -0.065em;
            color: #11203d;
        }

        .subtitle {
            color: #44557d;
            font-size: clamp(1.2rem, 1.1vw + 1rem, 2rem);
            font-weight: 600;
            margin-bottom: 18px;
        }

        .tagline {
            font-size: 1.06rem;
            line-height: 1.7;
            color: #566684;
            max-width: 620px;
            margin-bottom: 28px;
        }

        .creator-row {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(128, 111, 228, 0.07);
            color: #31476f;
            width: fit-content;
            margin-bottom: 28px;
            font-weight: 600;
        }

        .creator-row strong {
            color: #192646;
        }

        .cta-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .open-tracker-btn {
            position: relative;
            overflow: hidden;
            border: none;
            border-radius: 18px;
            padding: 18px 26px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #4f7cff, #7a68f4);
            color: #fff;
            box-shadow: 0 20px 30px rgba(79, 124, 255, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }

        .open-tracker-btn:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 24px 34px rgba(79, 124, 255, 0.32);
        }

        .open-tracker-btn i {
            margin-left: 8px;
        }

        .landing-visual {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: linear-gradient(180deg, rgba(79, 124, 255, 0.08), rgba(126, 103, 236, 0.05));
        }

        .visual-card {
            width: min(430px, 100%);
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(117, 136, 189, 0.18);
            border-radius: 28px;
            box-shadow: 0 26px 56px rgba(27, 40, 79, 0.12);
            overflow: hidden;
        }

        .visual-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #102345;
            color: #fff;
            padding: 18px 20px;
        }

        .visual-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #35d49e;
            box-shadow: 0 0 12px rgba(53, 212, 158, 0.8);
        }

        .visual-body {
            padding: 22px 20px 26px;
        }

        .mini-summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .mini-stat {
            border-radius: 18px;
            padding: 16px 12px;
            background: #f5f8ff;
            border: 1px solid rgba(134, 146, 194, 0.14);
        }

        .mini-stat .label {
            display: block;
            font-size: 0.72rem;
            color: #64769d;
            margin-bottom: 8px;
        }

        .mini-stat .value {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .mini-stat.blue .value {
            color: #4f7cff;
        }

        .mini-stat.purple .value {
            color: #7a68f4;
        }

        .mini-stat.green .value {
            color: #1bb989;
        }

        .mini-stat.red .value {
            color: #ff6a7d;
        }

        .chart-panel-preview {
            background: linear-gradient(180deg, #ffffff 0%, #f7f9ff 100%);
            border: 1px solid rgba(120, 130, 175, 0.14);
            border-radius: 20px;
            padding: 18px 18px 14px;
        }

        .chart-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.8rem;
            color: #64769d;
        }

        .donut-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 170px;
            position: relative;
        }

        .donut {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(#4f7cff 0 42%, #7a68f4 42% 68%, #2ec6a3 68% 87%, #ff6a7d 87% 100%);
            position: relative;
        }

        .donut::after {
            content: "";
            position: absolute;
            inset: 22px;
            background: white;
            border-radius: 50%;
        }

        .donut-center {
            position: absolute;
            font-weight: 800;
            color: #1e2a41;
            font-size: 1.2rem;
            letter-spacing: -0.04em;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(15px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .landing-copy>* {
            animation: floatUp 0.6s ease both;
        }

        .landing-copy>*:nth-child(2) {
            animation-delay: 0.08s;
        }

        .landing-copy>*:nth-child(3) {
            animation-delay: 0.14s;
        }

        .landing-copy>*:nth-child(4) {
            animation-delay: 0.2s;
        }

        .landing-copy>*:nth-child(5) {
            animation-delay: 0.26s;
        }

        .landing-copy>*:nth-child(6) {
            animation-delay: 0.32s;
        }

        @media (max-width: 980px) {
            .landing-main {
                grid-template-columns: 1fr;
            }

            .landing-copy {
                padding: 42px 24px 26px;
            }
        }

        @media (max-width: 640px) {
            .landing-header {
                padding: 16px 18px;
            }

            .landing-brand {
                font-size: 1rem;
            }

            .landing-copy {
                padding: 28px 18px 22px;
            }

            .creator-row {
                width: 100%;
                justify-content: center;
                text-align: center;
            }

            .cta-row {
                align-items: stretch;
            }

            .open-tracker-btn {
                width: 100%;
            }

            .mini-summary {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="landing-page">
        <div class="landing-wrap">
            <header class="landing-header">
                <div class="landing-brand">
                    <div class="landing-brand-badge"><i class="fa-solid fa-wallet"></i></div>
                    <span>SpendMate</span>
                </div>
            </header>

            <main class="landing-main">
                <section class="landing-copy">
                    <div class="eyebrow">Smart student finance</div>
                    <h1>SpendMate</h1>
                    <div class="subtitle">Student Expense Tracker</div>
                    <p class="tagline">Track your expenses. Manage your money. Spend smarter.</p>

                    <div class="creator-row">
                        <span>Created by</span>
                        <strong>Ankita MH &amp; Rashmi SH</strong>
                    </div>

                    <div class="cta-row">
                        <button class="open-tracker-btn" type="button" onclick="window.location.href='tracker.html'">
                            Open Student Expense Tracker <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </section>

                <section class="landing-visual" aria-label="SpendMate preview">
                    <div class="visual-card">
                        <div class="visual-topbar">
                            <span>SpendMate</span>
                            <div class="visual-status">
                                <span class="status-dot"></span>
                                <span>Live</span>
                            </div>
                        </div>

                        <div class="visual-body">
                            <div class="mini-summary">
                                <div class="mini-stat blue">
                                    <span class="label">Total Spend</span>
                                    <span class="value">₹6,250</span>
                                </div>
                                <div class="mini-stat purple">
                                    <span class="label">This Month</span>
                                    <span class="value">₹4,180</span>
                                </div>
                                <div class="mini-stat green">
                                    <span class="label">Saved</span>
                                    <span class="value">₹9,000</span>
                                </div>
                                <div class="mini-stat red">
                                    <span class="label">Budget Left</span>
                                    <span class="value">₹7,900</span>
                                </div>
                            </div>

                            <div class="chart-panel-preview">
                                <div class="chart-head">
                                    <span>Expense Breakdown</span>
                                    <span>Aug</span>
                                </div>

                                <div class="donut-wrap">
                                    <div class="donut"></div>
                                    <div class="donut-center">₹12K</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
